server:
  port: 8080

spring:
  application:
    name: ewm-main-service
  datasource:
    url: jdbc:postgresql://localhost:6542/ewm
    username: ewm
    password: ewm
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

stats-server:
  url: http://localhost:9090

management:
  endpoints:
    web:
      exposure:
        include: health,info